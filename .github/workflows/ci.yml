name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # The commit-message step below reads every commit of the pull request.
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # typecheck, lint, format, test, build, then charcheck over this repo.
      # End-to-end render tests are opt-in through INJECTLAB_E2E and stay off here: they
      # need a Chromium download, and whether CI pays that cost is a decision for the
      # renderer, not for the scaffold.
      - run: pnpm run check

      # Commit messages are prose a reader sees, held to the same character rule as the README.
      - name: charcheck over the pull request's commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for sha in $(git rev-list "$BASE..$HEAD"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/commit-msg"
            pnpm exec charcheck --commit-msg "$RUNNER_TEMP/commit-msg" || { echo "in $sha"; status=1; }
          done
          exit "$status"

  commit-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: commit-check/commit-check-action@v2
        with:
          message: true
          branch: false
