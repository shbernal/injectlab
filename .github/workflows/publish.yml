name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # The two packages share one version (CHANGELOG.md), and so does the root manifest.
      - name: the tag matches every manifest
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for manifest in package.json packages/core/package.json packages/cli/package.json; do
            v="$(node -p "require('./$manifest').version")"
            test "$tag" = "$v" || { echo "tag $tag != $manifest $v"; exit 1; }
          done

      - run: pnpm run check

      # pnpm rather than npm: it rewrites the CLI's `workspace:*` dependency on core to the
      # concrete version. A recursive publish goes in dependency order, so core is on the
      # registry before the CLI that needs it; the private root is skipped. The tag is a
      # detached checkout, hence --no-git-checks.
      - run: pnpm -r publish --access public --provenance --no-git-checks
