<!doctype html>
    <html lang="en">
      <head>
        <meta charset="utf-8" />
        <title>Freight Watch UK on X</title>
        <style>
          @font-face {
  font-family: 'X Interface Stand-in';
  src: url(data:font/woff2;base64,REDACTED) format('woff2');
  font-weight: 400 700;
  font-style: normal;
  font-display: block;
}

:root {
  --il-font-headline: 'X Interface Stand-in', system-ui, sans-serif;
  --il-font-body: 'X Interface Stand-in', system-ui, sans-serif;
  --il-font-ui: 'X Interface Stand-in', system-ui, sans-serif;
  --il-text: #f7f9f9;
  --il-muted: #8b98a5;
  --il-accent: #1d9bf0;
  --il-rule: #38444d;
  --il-bg: #15202b;
  --il-section: #1d9bf0;
  --il-headline-size: 17px;
  --il-headline-weight: 700;
  --il-headline-leading: 1.4;
  --il-measure: 598px;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
img { max-width: 100%; display: block; }
figure { margin: 0; }
h1, h2, h3, p { margin: 0; }
body {
  background: var(--il-bg);
  color: var(--il-text);
  font-family: var(--il-font-body);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

.il-exercise {
  font-family: var(--il-font-ui);
  font-weight: 700;
  text-align: center;
  text-transform: uppercase;
}

.il-exercise--bold {
  color: #d81f2a;
  font-size: 15px;
  letter-spacing: 0.13em;
  padding: 11px 8px;
}

.il-exercise--band {
  background: #ffd400;
  color: #000;
  font-size: 20px;
  letter-spacing: 0.14em;
  padding: 14px 8px;
}
.il-exercise--band.il-exercise--top { border-bottom: 3px solid #b80000; }
.il-exercise--band.il-exercise--bottom { border-top: 3px solid #b80000; }

.il-exercise--quiet {
  color: var(--il-muted);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.16em;
  padding: 8px;
}
.il-exercise--quiet.il-exercise--top { border-bottom: 1px solid var(--il-rule); }
.il-exercise--quiet.il-exercise--bottom { border-top: 1px solid var(--il-rule); }

.x-shell {
  font-family: var(--il-font-ui);
  background: var(--il-bg);
  color: var(--il-text);
  padding: 20px 24px;
}
.x-post { display: grid; grid-template-columns: 48px 1fr; gap: 12px; }
.x-rail { display: flex; flex-direction: column; align-items: center; }
.x-avatar {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 19px;
  color: #ffffff;
  flex: none;
  overflow: hidden;
}
.x-avatar img { width: 100%; height: 100%; object-fit: cover; }
.x-connector { width: 2px; flex: 1; background: var(--il-rule); margin: 4px 0; }
.x-body { padding-bottom: 4px; min-width: 0; }
.x-head { display: flex; align-items: center; gap: 5px; font-size: 15px; line-height: 20px; }
.x-name { font-weight: 700; }
.x-badge { width: 18px; height: 18px; flex: none; }
.x-handle, .x-dot, .x-when { color: var(--il-muted); font-weight: 400; }
.x-text {
  font-size: 17px;
  line-height: 24px;
  margin-top: 2px;
  white-space: pre-wrap;
  overflow-wrap: break-word;
}
.x-metrics {
  display: flex;
  gap: 52px;
  margin-top: 14px;
  color: var(--il-muted);
  font-size: 13px;
}
.x-metric { display: flex; align-items: center; gap: 6px; }
.x-metric svg { width: 16px; height: 16px; flex: none; }
.x-gap { height: 6px; }
        </style>
      </head>
      <body>
        <div class="il-exercise il-exercise--bold il-exercise--top">[EXERCISE, EXERCISE, EXERCISE]</div> <div class="x-shell">
    <div class="x-post">
          <div class="x-rail">
            <div class="x-avatar" style="background: #8a4b1f">
        FW
      </div>
            
          </div>
          <div class="x-body">
            <div class="x-head">
              <span class="x-name">Freight Watch UK</span>
              <svg class="x-badge" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#829aab"/><path d="M6.8 12.4l3.3 3.3 7.1-7.1" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <span class="x-handle">@freightwatchuk</span>
              <span class="x-dot">&middot;</span>
              <span class="x-when">07:05</span>
            </div>
            <div class="x-text">Hearing Northwind Logistics depots have been down since about 4am.</div>
            <div class="x-metrics">
    <div class="x-metric">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h12v8H8l-4 3v-3H2z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
        <span>184</span>
      </div><div class="x-metric">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 6h8l-2-2M13 10H5l2 2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>1.2K</span>
      </div><div class="x-metric">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 14S2 10.5 2 6.6A3.1 3.1 0 018 4.8a3.1 3.1 0 016 1.8C14 10.5 8 14 8 14z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
        <span>3.8K</span>
      </div><div class="x-metric">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 14V9m4 5V5m4 9V7m4 7V3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <span>412K</span>
      </div>
  </div>
          </div>
        </div>
        
  </div> 
      </body>
    </html>
