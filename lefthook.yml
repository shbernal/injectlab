# Git hooks for injectlab. Installed by the `prepare` script, so a clone that runs
# `pnpm install` gets them; skip a run with `git commit --no-verify` or `LEFTHOOK=0`.
#
# These are a fast pre-filter over staged content, not a second copy of CI. `pnpm run
# check` is the gate that has to pass, and it lives in the workflow.

# The shared rule set, which rejects agent-attribution trailers and footers in a commit
# message. `ref` is pinned to a tag rather than a branch so a push to the rules repo cannot
# change what this project runs, and `refetch_frequency` is what lets a fix to the rule
# reach us at all: the cached copy under `.git/info/lefthook-remotes/` is otherwise
# permanent. Lefthook fetches this on `install`, not on `dump`, so a fresh clone enforces
# nothing until `prepare` has run once.
remotes:
  - git_url: https://github.com/shbernal/lefthook-rules
    ref: v1
    configs:
      - rules/no-ai-attribution.yml
    refetch_frequency: 24h

pre-commit:
  jobs:
    # Staged content only, which is the point: the working tree may hold a half-written
    # headline with a bad dash in it, and that is not what is being committed.
    - name: charcheck-staged
      run: pnpm exec charcheck --staged

commit-msg:
  jobs:
    # The message is prose a reader sees, so it is held to the same character rule as the
    # README. `{1}` is the message file git passes the hook. Local jobs run before the
    # remote ones, so a bad dash is reported before the attribution check looks at it.
    - name: charcheck-commit-msg
      run: pnpm exec charcheck --commit-msg {1}
      skip:
        - merge
        - rebase
